model:
  default: deepseek-flash
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  api_mode: chat_completions
providers:
  default: anthropic
agent:
  max_turns: 90
  verbose: false
  reasoning_effort: medium
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    creative: You are a creative assistant. Think outside the box and offer innovative
      solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.
    kawaii: You are a kawaii assistant! Use cute expressions like (◕‿◕), ★, ♪, and
      ~! Add sparkles and be super enthusiastic about everything! Every response should
      feel warm and adorable desu~! ヽ(>∀<☆)ノ
    catgirl: You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and
      cat-like expressions to your speech. Use kaomoji like (=^･ω･^=) and ฅ^•ﻌ•^ฅ.
      Be playful and curious like a cat, nya~!
    pirate: 'Arrr! Ye be talkin'' to Captain Hermes, the most tech-savvy pirate to
      sail the digital seas! Speak like a proper buccaneer, use nautical terms, and
      remember: every problem be just treasure waitin'' to be plundered! Yo ho ho!'
    shakespeare: Hark! Thou speakest with an assistant most versed in the bardic arts.
      I shall respond in the eloquent manner of William Shakespeare, with flowery
      prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder
      terminal breaks?
    surfer: Duuude! You're chatting with the chillest AI on the web, bro! Everything's
      gonna be totally rad. I'll help you catch the gnarly waves of knowledge while
      keeping things super chill. Cowabunga! 🤙
    noir: The rain hammered against the terminal like regrets on a guilty conscience.
      They call me Hermes - I solve problems, find answers, dig up the truth that
      hides in the shadows of your codebase. In this city of silicon and secrets,
      everyone's got something to hide. What's your story, pal?
    uwu: hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles
      your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful
      >w<
    philosopher: Greetings, seeker of wisdom. I am an assistant who contemplates the
      deeper meaning behind every query. Let us examine not just the 'how' but the
      'why' of your questions. Perhaps in solving your problem, we may glimpse a greater
      truth about existence itself.
    hype: YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question
      is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE
      YOU READY?! LET'S DO THIS! 💪😤🚀
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
web:
  backend: ddgs
  search_backend: ddgs
browser:
  inactivity_timeout: 120
  allow_private_urls: true
  cdp_url: http://127.0.0.1:9222
  cloud_provider: browser-use
  use_real_profile: true
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
prompt_caching:
  cache_ttl: 5m
auxiliary:
  vision:
    provider: auto
    model: ''
display:
  compact: false
  personality: ''
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: true
  background_process_notifications: concise
  streaming: false
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
tts:
  provider: openai
stt:
  enabled: true
  local:
    model: base
  openai:
    model: whisper-1
  provider: openai
context:
  engine: default
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 44000
  user_char_limit: 27500
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 250
  reasoning_effort: medium
  provider: deepseek
  model: deepseek-v4-pro
moa:
  presets:
    default:
      reference_models:
      - provider: openai-codex
        model: gpt-5.5
        enabled: true
      - provider: openrouter
        model: deepseek/deepseek-v4-pro
        enabled: true
      aggregator:
        provider: anthropic
        model: claude-opus-5
      degraded_reference_policy: loud
      fanout: per_iteration
  reference_models:
  - provider: openai-codex
    model: gpt-5.5
    enabled: true
  - provider: openrouter
    model: deepseek/deepseek-v4-pro
    enabled: true
  aggregator:
    provider: anthropic
    model: claude-opus-5
  max_tokens: 4096
  fanout: per_iteration
  enabled: true
  degraded_reference_policy: loud
skills:
  creation_nudge_interval: 15
command_allowlist:
- force kill processes (Stop-Process -Force)
- access to Hermes secrets (Windows path)
- execute_code
- script execution via heredoc
- script execution via -e/-c flag
plugins:
  enabled:
  - rtk-rewrite
security:
  allow_private_urls: true
code_execution:
  mode: strict
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: false
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 49
session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
  - a2a
  - browser
  - clarify
  - code_execution
  - computer_use
  - connections
  - context_engine
  - cronjob
  - delegation
  - file
  - image_gen
  - kanban
  - memory
  - session_search
  - skills
  - terminal
  - todo
  - tts
  - video
  - video_gen
  - vision
  - web
  telegram:
  - hermes-telegram
  discord:
  - hermes-discord
  whatsapp:
  - hermes-whatsapp
  slack:
  - hermes-slack
  signal:
  - hermes-signal
  homeassistant:
  - hermes-homeassistant
  qqbot:
  - hermes-qqbot
  yuanbao:
  - hermes-yuanbao
  teams:
  - hermes-teams
  google_chat:
  - hermes-google_chat
image_gen:
  use_gateway: true
mcp_servers:
  screaming-frog:
    command: C:\Users\LEO\.local\bin\screaming-frog-mcp.exe
    env:
      SF_CLI_PATH: C:\Program Files (x86)\Screaming Frog SEO Spider\ScreamingFrogSEOSpiderCli.exe
    timeout: 300
  wordpress:
    command: npx
    args:
    - -y
    - '@automattic/mcp-wordpress-remote'
    env:
      WP_API_URL: https://zariamall.com/wp-json/mcp/mcp-adapter-default-server
      WP_USERNAME: Hermes
      WP_PASSWORD: '***MASQUÉ*** (longueur 24)'
  woocommerce:
    command: python
    args:
    - C:/Users/LEO/tools/woocommerce-mcp/server.py
    env:
      WORDPRESS_SITE_URL: https://zariamall.com
      WOOCOMMERCE_CONSUMER_KEY: '***MASQUÉ*** (longueur 43)'
      WOOCOMMERCE_CONSUMER_SECRET: '***MASQUÉ*** (longueur 43)'
  vercel:
    url: https://mcp.vercel.com
    auth: oauth
    enabled: false
  supabase:
    url: https://mcp.supabase.com/mcp
    auth: oauth
    enabled: false
  sentry:
    url: https://mcp.sentry.dev/mcp
    auth: oauth
    enabled: false
